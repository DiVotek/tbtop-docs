name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Gates (lint + format + types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run types:check
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: site
          path: build/client
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to docs.tbtop.dev
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs.tbtop.dev
    # Never cut a running deploy short; a newer merge waits behind it and still deploys last.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deploy the exact files the gates built, not a second build.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build/client

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The account that holds the tbtop.dev zone.
          CLOUDFLARE_ACCOUNT_ID: 9fc01736a7873ba44582cf173fc5a157
